<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Metrolink Station Screen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anta&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Dark field: light-on-dark cuts sun glare on outdoor LCDs (ADA 703.5.1 non-glare, high contrast). Metrolink blue stays as accent. */
:root { --blue: #0049BA; --bg: #000c24; --rh: 14px; }
html, body { margin: 0; height: 100%; background: #000510; overflow: hidden; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
/* Anta for names and headers; a plain sans with tabular figures for times, minutes and tracks (ADA 703.5.2). */
.num, #clock, .dep, .stats big, .stats b { font-family: 'Inter', sans-serif; font-variant-numeric: tabular-nums; }

/* 9:16 portrait panel (1080 x 1920, standard 55in totem). Laid out on that canvas and scaled to fit.
   Top: public glance band, readable from the platform. Middle: line map. Bottom: touch console within reach. */
#stage { position: absolute; left: 50%; top: 50%; width: 1080px; height: 1920px; transform: translate(-50%, -50%) scale(var(--s, .5));
  background: var(--bg); overflow: hidden; font-family: 'Anta', sans-serif; color: #fff; letter-spacing: -.006em; user-select: none; -webkit-user-select: none; }

/* ---------- Glance band (always on, for everyone on the platform) ---------- */
#glance { position: absolute; left: 0; right: 0; top: 0; height: 650px; padding: 28px 36px; box-sizing: border-box; border-bottom: 1px solid rgba(255,255,255,.25); }
.gHead { display: flex; justify-content: space-between; align-items: flex-start; }
#gName { font-weight: 400; font-size: 64px; line-height: 1; margin: 10px 0 0; letter-spacing: -.02em; }
.corner { display: flex; align-items: flex-start; gap: 28px; text-align: right; }
.corner .lockup { width: 120px; display: block; margin-top: 4px; }
#clock { font-size: 60px; font-weight: 500; line-height: 1; letter-spacing: -.02em; }
#date { font-size: 18px; opacity: .75; margin-top: 8px; letter-spacing: .08em; }
.gMeta { display: flex; justify-content: space-between; align-items: center; margin-top: 18px; }
.gMeta .tags { font-size: 20px; }
#status { font-size: 22px; display: flex; align-items: center; gap: 12px; }
#status i { width: 14px; height: 14px; border-radius: 50%; background: #3ccf6a; }
#deps { margin-top: 26px; }
.dep { display: grid; grid-template-columns: 230px 1fr 150px; align-items: center; height: 130px; border-top: 1px solid rgba(255,255,255,.18); }
.dep .min { font-size: 110px; font-weight: 500; line-height: 1; letter-spacing: -.03em; }
.dep .min small { font-size: 28px; font-weight: 400; letter-spacing: 0; margin-left: 6px; opacity: .8; }
.dep .to { font-size: 44px; font-weight: 500; line-height: 1.1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.dep .sub { font-size: 22px; opacity: .78; margin-top: 8px; white-space: nowrap; }
.dep .sub svg { width: 34px; height: 16px; margin-right: 10px; vertical-align: -1px; }
.dep .trk { text-align: right; }
.dep .trk b { display: block; font-size: 110px; font-weight: 500; line-height: 1; }

/* ---------- Line map field ---------- */
#field { position: absolute; left: 36px; right: 36px; top: 668px; height: 672px; display: grid; grid-template-columns: 1fr 1fr; column-gap: 36px; }
.sec { margin-top: var(--rh); }
.col > .sec:first-child { margin-top: 0; }
.row { display: flex; justify-content: space-between; height: var(--rh); line-height: var(--rh); font-size: 12px; white-space: nowrap; }
.row.head { text-transform: uppercase; }
.row span { display: inline-block; transform-origin: center; transition: opacity .7s ease, transform .7s ease, text-shadow .7s ease; transition-delay: var(--d, 0ms); }
.row span.st { cursor: pointer; }
#field.hidden .row span { opacity: 0; }
#field.focus .row span { opacity: .13; }
#field.focus .row.mid span { opacity: .5; }
#field.focus .row.on span { opacity: 1; }
#field .row.on span.hl { transform: scale(1.22); text-shadow: 0 0 8px rgba(255,255,255,.75); }

.train { position: absolute; height: 2px; width: 16px; border-radius: 1px; background: #fff; box-shadow: 0 0 6px #fff; opacity: .55; pointer-events: none; transition: opacity .6s; }
#trains.quiet .train:not(.me) { opacity: 0; }
#field.hidden .train { opacity: 0; }
.train.me { width: 30px; height: 3px; opacity: 0; box-shadow: 0 0 10px 2px rgba(255,255,255,.85); }
.train.me.show { opacity: 1; animation: blink 1.6s ease-in-out infinite; }
@keyframes blink { 50% { box-shadow: 0 0 3px 0 rgba(255,255,255,.4); } }

/* ---------- Touch console (bottom, within reach) ---------- */
#console { position: absolute; left: 0; right: 0; top: 1352px; bottom: 0; border-top: 1px solid rgba(255,255,255,.35);
  transition: opacity .8s ease, transform .8s ease; }
#console.hidden { opacity: 0; transform: translateY(40px); }
label, .lbl { display: block; font-size: 16px; letter-spacing: .18em; text-transform: uppercase; opacity: .75; }
.pane { position: absolute; inset: 26px 36px; display: flex; flex-direction: column; opacity: 0; transform: translateY(14px); pointer-events: none; transition: opacity .6s ease, transform .6s ease; }
.pane.show { opacity: 1; transform: none; pointer-events: auto; }

.tags { display: flex; gap: 22px; font-size: 18px; flex-wrap: wrap; }
.tag svg { width: 30px; height: 14px; margin-right: 8px; vertical-align: -1px; }
.tag em { font-style: normal; opacity: .6; margin-left: 4px; }
.pick { opacity: 0; transform: translateY(10px); transition: opacity .6s ease, transform .6s ease; }
.pick.show { opacity: 1; transform: none; }
.pick:not(.show) { pointer-events: none; }
.pick label span { text-transform: none; letter-spacing: 0; margin-left: 14px; opacity: .85; }
#destList { margin-top: 14px; columns: 5; column-gap: 16px; }
#destList button { display: block; width: 100%; text-align: left; font-size: 17px; line-height: 36px; opacity: .85; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#destList button:hover, #destList button:focus-visible { opacity: 1; outline: none; text-decoration: underline; text-underline-offset: 4px; }

#rTitle { font-weight: 400; font-size: 34px; line-height: 1.1; margin: 8px 0 12px; letter-spacing: -.02em; }
#diagram { display: block; width: 1008px; height: 120px; margin-top: 18px; overflow: visible; flex: none; }
#diagram text { fill: #fff; font-family: 'Anta', sans-serif; }
#dTrain { filter: drop-shadow(0 0 6px #fff); }
.stats { display: grid; grid-template-columns: 1.3fr 1fr 1fr; gap: 28px; margin-top: 14px; }
.stats big { display: block; font-size: 88px; font-weight: 500; line-height: 1; margin-top: 8px; letter-spacing: -.03em; }
.stats b { display: block; font-weight: 500; font-size: 40px; line-height: 1; margin-top: 8px; }
.stats p { margin: 8px 0 0; font-size: 18px; opacity: .8; }
/* 56px-tall targets: comfortably above the 44px minimum touch size (WCAG 2.5.5). */
.actions { margin-top: auto; align-self: flex-end; display: flex; gap: 14px; }
.actions button { border: 1px solid rgba(255,255,255,.7); border-radius: 8px; height: 56px; padding: 0 28px; font-size: 20px; }
.actions button:hover, .actions button:focus-visible { background: #fff; color: var(--bg); outline: none; }

@media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition-duration: .01ms !important; animation: none !important; } }
</style>
</head>
<body>
<div id="stage">
  <div id="glance">
    <div class="gHead">
      <div><label>Station</label><h1 id="gName"></h1></div>
      <div class="corner"><div><div id="clock"></div><div id="date"></div></div><svg class="lockup" role="img" aria-label="Metrolink" viewBox="0 0 1634 815" fill="#fff"><path fill-rule="evenodd" d="M637.1,0.0L637.1,187.2L454.7,187.2C415.7,187.2 378.5,204.0 352.8,233.3L351.1,235.1L255.7,337.6L-0.0,337.6L213.3,108.5C274.5,39.5 362.5,0.0 454.7,0.0L637.1,0.0ZM1134.1,0.0L1134.1,187.2L951.8,187.2C912.8,187.2 875.6,204.0 849.8,233.3L848.1,235.1L752.7,337.6L497.1,337.6L710.3,108.5C771.6,39.5 859.5,0.0 951.8,0.0L1134.1,0.0ZM1634.0,0.0L1634.0,187.2L1451.7,187.2C1412.7,187.2 1375.5,204.0 1349.7,233.3L1348.0,235.1L1013.5,576.7L757.9,576.7L1210.2,108.5C1271.5,39.5 1359.4,0.0 1451.7,0.0L1634.0,0.0ZM1532.3,694.9L1549.9,694.9L1549.9,743.0L1558.7,743.0L1605.7,694.9L1630.0,694.9L1572.6,753.6L1633.5,813.5L1608.9,813.5L1555.1,760.6L1549.9,760.6L1549.9,813.5L1532.3,813.5L1532.3,694.9ZM1331.5,694.9L1354.3,694.9L1406.0,788.1L1406.0,694.9L1423.6,694.9L1423.6,813.5L1400.7,813.5L1349.1,721.6L1349.1,813.5L1331.5,813.5L1331.5,694.9ZM1205.1,694.9L1222.7,694.9L1222.7,813.5L1205.1,813.5L1205.1,694.9ZM1012.7,694.9L1030.3,694.9L1030.3,780.3C1030.3,784.7 1031.8,788.4 1034.8,791.4C1037.9,794.5 1041.6,796.0 1045.9,796.0L1104.6,796.0L1104.6,813.5L1045.9,813.5C1039.8,813.5 1034.2,812.0 1029.2,809.1C1024.2,806.1 1020.2,802.1 1017.2,797.1C1014.2,792.0 1012.7,786.4 1012.7,780.3L1012.7,694.9ZM605.3,694.9L668.0,694.9C673.4,694.9 678.3,696.3 682.7,698.9C687.1,701.5 690.6,705.0 693.3,709.4C695.9,713.8 697.3,718.7 697.3,724.1L697.3,736.0C697.3,741.4 696.0,746.2 693.3,750.6C690.8,754.9 687.3,758.3 682.8,760.9C678.4,763.5 673.4,764.7 667.9,764.7L703.3,813.5L681.8,813.5L646.5,764.7C644.8,762.6 643.4,760.8 642.1,759.0C638.3,754.2 641.8,747.2 647.9,747.2L668.0,747.2C671.3,747.2 674.1,746.1 676.3,743.9C678.6,741.6 679.8,738.9 679.8,735.7L679.8,724.1C679.8,720.9 678.6,718.1 676.3,715.9C674.1,713.6 671.3,712.4 668.0,712.4L622.9,712.4L622.9,813.5L605.3,813.5L605.3,694.9ZM408.3,694.9L504.9,694.9L504.9,712.4L465.4,712.4L465.4,813.5L447.7,813.5L447.7,712.4L408.3,712.4L408.3,694.9ZM217.5,694.9L309.5,694.9L309.5,712.4L235.1,712.4L235.1,795.9L309.5,795.9L309.5,813.5L217.5,813.5L217.5,694.9ZM252.1,752.5C257.3,746.5 264.9,743.0 272.9,743.0L309.5,743.0L309.5,760.6L245.1,760.6L252.1,752.5ZM0.0,694.9L16.1,694.9L54.4,741.7L92.7,694.9L108.7,694.9L108.7,813.5L91.2,813.5L91.2,724.9L61.7,760.6L47.1,760.6L17.6,724.9L17.6,813.5L0.0,813.5L0.0,694.9ZM793.86,754.52a59.58,59.58 0 1,0 119.16,0a59.58,59.58 0 1,0 -119.16,0ZM812.19,754.52a41.25,41.25 0 1,0 82.5,0a41.25,41.25 0 1,0 -82.5,0Z"/></svg></div>
    </div>
    <div class="gMeta"><div class="tags" id="oTags"></div><div id="status" role="status"><i></i>All trains on time</div></div>
    <div id="deps"><label>Next departures</label><div id="depList"></div></div>
  </div>
  <div id="field" class="hidden"></div>

  <div id="console" class="hidden">

    <div class="pane" id="pStation">
      <div class="pick" id="pick"><label>Where to?<span>Tap a station below or anywhere on the map</span></label><div id="destList"></div></div>
    </div>

    <div class="pane" id="pRoute">
      <label>Your trip</label><h2 id="rTitle"></h2><div class="tags" id="rTags"></div>
      <svg id="diagram" viewBox="0 0 1008 120"></svg>
      <div class="stats">
        <div><label id="sLabel"></label><big id="sBig"></big><p id="sLoc"></p></div>
        <div><label>Departs</label><b id="sDep"></b><p id="sTrack"></p></div>
        <div><label id="sArrL"></label><b id="sArr"></b><p id="sDur"></p></div>
      </div>
      <div class="actions"><button id="bBack">Change destination</button><button id="bDone">Done</button></div>
    </div>
  </div>

</div>

<script>
// ---------------- Data ----------------
// Stop order runs from the outer terminal toward the line's end, as on the poster.
const LA = 'Los Angeles Union Station';
const LINES = [
  { id: 'AVL', name: 'Antelope Valley Line', color: '#35973A', no: 211, stops: ['Lancaster', 'Palmdale', 'Vincent Grade/Acton', 'Santa Clarita', 'Newhall', 'Sylmar/San Fernando', 'Sun Valley', 'Burbank Airport-North', 'Burbank Downtown', 'Glendale', LA] },
  { id: 'SBL', name: 'San Bernardino Line', color: '#A32236', no: 323, stops: ['San Bernardino-Downtown', 'San Bernardino Depot', 'Rialto', 'Fontana', 'Rancho Cucamonga', 'Upland', 'Montclair', 'Claremont', 'Pomona-North', 'Covina', 'Baldwin Park', 'El Monte', 'Cal State LA', LA] },
  { id: 'VCL', name: 'Ventura County Line', color: '#F6A706', no: 112, stops: ['East Ventura', 'Oxnard', 'Camarillo', 'Moorpark', 'Simi Valley', 'Chatsworth', 'Northridge', 'Van Nuys', 'Burbank Airport-South', 'Burbank Downtown', 'Glendale', LA] },
  { id: 'OCL', name: 'Orange County Line', color: '#EE7B00', no: 684, stops: ['Oceanside', 'San Clemente Pier', 'San Clemente', 'San Juan Capistrano', 'Laguna Niguel/Mission Viejo', 'Irvine', 'Tustin', 'Santa Ana', 'Orange', 'Anaheim', 'Fullerton', 'Buena Park', 'Norwalk/Santa Fe Springs', 'Commerce', LA] },
  { id: 'RIV', name: 'Riverside Line', color: '#5C3597', no: 404, stops: ['Riverside-Downtown', 'Pedley', 'East Ontario', 'Ontario', 'Pomona-Downtown', 'Industry', 'Montebello/Commerce', LA] },
  { id: '91PV', name: '91/Perris Valley Line', color: '#0171CE', no: 751, stops: ['Perris-South', 'Perris-Downtown', 'Moreno Valley/March Field', 'Riverside-Hunter Park/UCR', 'Riverside-Downtown', 'Riverside-La Sierra', 'Corona-North Main', 'Corona-West', 'Fullerton', 'Buena Park', 'Norwalk/Santa Fe Springs', LA] },
  { id: 'IEOC', name: 'Inland Empire-Orange County Line', color: '#BC295B', no: 852, stops: ['San Bernardino-Downtown', 'San Bernardino Depot', 'Riverside-Downtown', 'Riverside-La Sierra', 'Corona-North Main', 'Corona-West', 'Anaheim Canyon', 'Orange', 'Santa Ana', 'Tustin', 'Irvine', 'Laguna Niguel/Mission Viejo', 'San Juan Capistrano', 'San Clemente', 'San Clemente Pier', 'Oceanside'] },
];
const ALL = [...new Set(LINES.flatMap(L => L.stops))].sort((a, b) => a.localeCompare(b));

const Q = new URLSearchParams(location.search);
const ORIGIN = ALL.includes(Q.get('station')) ? Q.get('station') : 'Fullerton';
const SPEED = Math.min(120, Math.max(1, +Q.get('speed') || 1)); // ?speed=20 for demos
const SEG = 420;      // shortcut: flat 7 min between stops; swap in Metrolink GTFS schedule + GTFS-RT positions for real service
const DWELL = 60, TRANSFER = 360;
if (Q.has('embed')) document.documentElement.style.background = document.body.style.background = 'transparent'; // ?embed: no dark letterbox around the screen

const $ = s => document.querySelector(s);
const make = (tag, cls, txt) => { const e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; };
const NS = 'http://www.w3.org/2000/svg';
const svg = (tag, attrs) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); return e; };

// ---------------- Scale to screen ----------------
const fit = () => $('#stage').style.setProperty('--s', Math.min(innerWidth / 1080, innerHeight / 1920));
addEventListener('resize', fit); fit();

// ---------------- Route planning (fewest transfers, then fewest stops) ----------------
function plan(o, d) {
  let best = null;
  const go = (at, legs, used) => LINES.forEach(L => {
    const a = L.stops.indexOf(at);
    if (a < 0 || used.includes(L)) return;
    const b = L.stops.indexOf(d);
    if (b >= 0) {
      const c = [...legs, { L, a, b }], s = c.length * 1000 + c.reduce((n, g) => n + Math.abs(g.b - g.a), 0);
      if (!best || s < best.s) best = { s, legs: c };
      return;
    }
    if (legs.length < 2) L.stops.forEach((x, j) => j !== a && go(x, [...legs, { L, a, b: j }], [...used, L]));
  });
  go(o, [], []);
  return best && best.legs;
}
console.assert(ALL.every(d => d === ORIGIN || plan(ORIGIN, d)), 'some destination is unreachable from', ORIGIN);

// ---------------- Build the poster field ----------------
const field = $('#field'), R = [], ST = [];
const cols = [make('div', 'col'), make('div', 'col')]; field.append(...cols);
const COL2 = ['OCL', '91PV', 'IEOC']; // balances the two columns (45 vs 43 rows)
LINES.forEach(L => {
  const sec = make('div', 'sec');
  const head = make('div', 'row head');
  [...L.name.split(' '), `[${L.id}]`].forEach(w => head.append(make('span', '', w)));
  sec.append(head); R.push({ el: head, L, i: -1 });
  L.rows = L.stops.slice(0, -1).map((a, i) => {
    const b = L.stops[i + 1], el = make('div', 'row');
    const add = (w, st) => { const s = make('span', st ? 'st' : '', w); if (st) { s.dataset.st = st; ST.push(s); } el.append(s); };
    a.split(' ').forEach(w => add(w, a)); add('—'); add(L.id); add('—'); b.split(' ').forEach(w => add(w, b));
    sec.append(el);
    const r = { el, L, i, a, b }; R.push(r); return r;
  });
  cols[+COL2.includes(L.id)].append(sec);
});
const trains = make('div'); trains.id = 'trains'; field.append(trains);

// level(row) -> 'on' | 'mid' | '' ; hl = stations to emphasise ; delay(row, k) -> ms
function paint(level, hl = new Set(), delay = () => 0) {
  field.classList.add('focus');
  R.forEach((r, k) => {
    const lv = level(r);
    r.el.classList.toggle('on', lv === 'on'); r.el.classList.toggle('mid', lv === 'mid');
    r.el.style.setProperty('--d', delay(r, k) + 'ms');
  });
  ST.forEach(s => s.classList.toggle('hl', hl.has(s.dataset.st)));
}
const touches = (r, st) => r.a === st || r.b === st;
const serves = (L, st) => L.stops.includes(st);

// ---------------- Trains in the field ----------------
// A train at fractional stop index p on line L sits in row floor(p), at (p - row) of the row's width.
function placeTrain(el, L, p) {
  const r = L.rows[Math.min(Math.floor(p), L.rows.length - 1)], f = p - r.i;
  el.style.left = r.el.offsetLeft + f * (r.el.offsetWidth - el.offsetWidth) + 'px';
  el.style.top = r.el.offsetTop + 12 + 'px'; // underline position: rows are 14px, text sits above
}
const ambient = LINES.flatMap(L => [0, 1].map(k => {
  const el = make('div', 'train'); trains.append(el);
  return { el, L, p: Math.random() * (L.stops.length - 1), dir: k ? 1 : -1 };
}));
const me = make('div', 'train me'); trains.append(me);

// ---------------- Steps ----------------
let step = 'station', trip = null, idle = 0;
const fmtClock = (d) => d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
const mmss = s => { s = Math.max(0, Math.ceil(s)); return `${String(Math.floor(s / 60)).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}`; };
// Line ribbon from the mobile prototype's Explore page (assets/explore/line-*.svg), filled per line.
const RIBBON = 'M57.4978 0V14.904H41.0413C37.5206 14.904 34.1644 16.2414 31.8373 18.5712L31.6839 18.7202L23.0756 26.8821H0L19.2482 8.63451C24.7781 3.14552 32.713 0 41.0413 0H57.4978Z';
const tag = L => {
  const t = make('span', 'tag'), icon = svg('svg', { viewBox: '0 0 57.4978 26.8821', 'aria-hidden': 'true' });
  icon.append(svg('path', { d: RIBBON, fill: L.color }));
  t.append(icon, L.name, make('em', '', `[${L.id}]`));
  return t;
};

$('#gName').textContent = ORIGIN;
$('#oTags').append(...LINES.filter(L => serves(L, ORIGIN)).map(tag));
ALL.filter(s => s !== ORIGIN).forEach(s => {
  const b = make('button', '', s); b.title = s;
  b.addEventListener('click', () => go(s));
  b.addEventListener('pointerenter', () => preview(s));
  b.addEventListener('focus', () => preview(s));
  b.addEventListener('pointerleave', () => step === 'select' && showStation(false));
  $('#destList').append(b);
});

function showStation(withPick = true) {
  paint(r => (r.i < 0 ? serves(r.L, ORIGIN) : touches(r, ORIGIN)) ? 'on' : serves(r.L, ORIGIN) ? 'mid' : '', new Set([ORIGIN]));
  if (withPick) $('#pick').classList.add('show');
}
function preview(dest) {
  if (step !== 'select') return;
  paint(r => (r.i < 0 ? serves(r.L, dest) || serves(r.L, ORIGIN) : touches(r, dest) || touches(r, ORIGIN)) ? 'on' : '', new Set([ORIGIN, dest]));
}

function toStation() {
  step = 'station';
  $('#pRoute').classList.remove('show'); $('#pStation').classList.add('show'); $('#pick').classList.remove('show');
  trains.classList.remove('quiet'); me.classList.remove('show'); trip = null;
  const k0 = R.findIndex(r => touches(r, ORIGIN));
  paint(r => (r.i < 0 ? serves(r.L, ORIGIN) : touches(r, ORIGIN)) ? 'on' : serves(r.L, ORIGIN) ? 'mid' : '', new Set([ORIGIN]), (r, k) => Math.abs(k - k0) * 7);
  setTimeout(() => { if (step === 'station') { step = 'select'; showStation(); } }, 1400);
}

// ---------------- Trip timeline ----------------
function go(dest) {
  const legs = plan(ORIGIN, dest); if (!legs) return;
  step = 'route'; idle = 0;
  const g0 = legs[0], L0 = g0.L, dir = Math.sign(g0.b - g0.a);
  const eta = 180 + Math.random() * 300;                 // train is 3-8 min out
  const want = eta / SEG, avail = dir > 0 ? g0.a : L0.stops.length - 1 - g0.a;
  const back = Math.min(avail, want), start = g0.a - dir * back;
  const steps = [];
  const push = (o) => { o.d0 = steps.length ? steps.at(-1).d0 + Math.abs(steps.at(-1).p1 - steps.at(-1).p0) : 0; steps.push(o); };
  if (back < want) push({ L: L0, p0: start, p1: start, dur: (want - back) * SEG });   // waiting at the terminal
  push({ L: L0, p0: start, p1: g0.a, dur: back * SEG });
  push({ L: L0, p0: g0.a, p1: g0.a, dur: DWELL, board: true });
  const keys = [{ d: back, name: ORIGIN, sub: 'You are here', t: eta + DWELL, kind: 'origin' }];
  legs.forEach((g, k) => {
    if (k) push({ L: g.L, p0: g.a, p1: g.a, dur: TRANSFER });
    push({ L: g.L, p0: g.a, p1: g.b, dur: Math.abs(g.b - g.a) * SEG });
  });
  let t = 0; steps.forEach(s => { s.t0 = t; t += s.dur; });
  steps.forEach((s, k) => {
    if (k && s.p0 === s.p1 && !s.board && s.t0 > eta) keys.push({ d: s.d0, name: s.L.stops[s.p0], sub: 'Change trains', t: s.t0 + s.dur, kind: 'xfer' });
  });
  const last = steps.at(-1);
  keys.push({ d: last.d0 + Math.abs(last.p1 - last.p0), name: dest, sub: 'Destination', t, kind: 'dest' });
  trip = { dest, legs, steps, eta, total: t, D: keys.at(-1).d, keys, start, wall0: Date.now(), t0: performance.now() };

  // Field: journey rows on, rows the train still has to cover to reach you at half, the rest fades.
  const on = new Set(), mid = new Set(), order = new Map();
  legs.forEach(g => { const lo = Math.min(g.a, g.b), hi = Math.max(g.a, g.b); for (let i = lo; i < hi; i++) { on.add(g.L.rows[i]); } });
  let n = 0; legs.forEach(g => { const s = Math.sign(g.b - g.a); for (let i = g.a; i !== g.b; i += s) order.set(g.L.rows[s > 0 ? i : i - 1], n++); });
  for (let i = Math.min(start, g0.a); i < Math.max(start, g0.a); i++) mid.add(L0.rows[Math.floor(i)]);
  const lines = new Set(legs.map(g => g.L));
  const k0 = R.indexOf(L0.rows[Math.min(g0.a, L0.rows.length - 1)]);
  paint(r => r.i < 0 ? (lines.has(r.L) ? 'on' : '') : on.has(r) ? 'on' : mid.has(r) ? 'mid' : '',
    new Set([ORIGIN, dest, ...keys.map(k => k.name)]),
    (r, k) => order.has(r) ? 250 + order.get(r) * 70 : Math.abs(k - k0) * 4);
  trains.classList.add('quiet'); me.classList.add('show');

  // Console
  $('#rTitle').textContent = `${ORIGIN}  →  ${dest}`;
  $('#rTags').replaceChildren(...legs.map(g => tag(g.L)));
  const stops = legs.reduce((s, g) => s + Math.abs(g.b - g.a), 0);
  $('#rTags').append(make('span', 'tag', legs.length > 1 ? `${legs.length - 1} transfer${legs.length > 2 ? 's' : ''} · ${stops} stops` : `Direct · ${stops} stops`));
  $('#sTrack').textContent = `Track ${1 + LINES.indexOf(L0) % 3} · Train ${L0.no}`;
  $('#sDep').textContent = fmtClock(new Date(trip.wall0 + (eta + DWELL) * 1000));
  $('#sArr').textContent = fmtClock(new Date(trip.wall0 + t * 1000));
  $('#sArrL').textContent = `Arrive ${dest}`;
  $('#sDur').textContent = `${Math.round((t - eta - DWELL) / 60)} min trip`;
  drawDiagram();
  $('#pStation').classList.remove('show'); $('#pRoute').classList.add('show');
}

const W = 1008, PAD = 80, Y = 62;
const dx = d => PAD + (trip.D ? d / trip.D : 0) * (W - 2 * PAD);
function drawDiagram() {
  const g = $('#diagram'); g.replaceChildren();
  const xo = dx(trip.keys[0].d);
  if (trip.keys[0].d > 0) g.append(svg('line', { x1: PAD, x2: xo, y1: Y, y2: Y, stroke: '#fff', 'stroke-width': 2, 'stroke-dasharray': '4 6', opacity: .5 }));
  g.append(svg('line', { x1: xo, x2: W - PAD, y1: Y, y2: Y, stroke: '#fff', 'stroke-width': 3 }));
  // ticks at every stop the train passes
  const tick = d => g.append(svg('line', { x1: dx(d), x2: dx(d), y1: Y - 5, y2: Y + 5, stroke: '#fff', 'stroke-width': 1.5, opacity: .7 }));
  trip.steps.forEach(s => {
    if (s.p0 === s.p1) return;
    const n = Math.abs(s.p1 - s.p0), first = (s.p1 > s.p0 ? Math.ceil(s.p0) - s.p0 : s.p0 - Math.floor(s.p0)) || 1;
    for (let k = first; k <= n + 1e-6; k++) tick(s.d0 + k);
  });
  const labs = [];
  trip.keys.forEach((k, i) => {
    // a key crowded by the next one hangs its label to the left so the two names don't collide
    const x = dx(k.d), nx = trip.keys[i + 1] && dx(trip.keys[i + 1].d);
    const anchor = x < 140 ? 'start' : x > W - 140 ? 'end' : nx && nx - x < 320 ? 'end' : 'middle';
    g.append(svg('circle', { cx: x, cy: Y, r: k.kind === 'origin' ? 7 : 6, fill: k.kind === 'origin' ? '#fff' : 'var(--bg)', stroke: '#fff', 'stroke-width': 2.5 }));
    const sub = svg('text', { x, y: 14, 'text-anchor': anchor, 'font-size': 13, 'letter-spacing': '.18em', opacity: .7 }); sub.textContent = k.sub.toUpperCase();
    const nm = svg('text', { x, y: 36, 'text-anchor': anchor, 'font-size': 20 }); nm.textContent = k.name;
    const tm = svg('text', { x, y: 96, 'text-anchor': anchor, 'font-size': 18, opacity: .8 }); tm.textContent = fmtClock(new Date(trip.wall0 + k.t * 1000));
    const lab = svg('g', {}); lab.append(sub, nm, tm); g.append(lab); labs.push(lab);
  });
  // measured pass: push any label still touching the next one to the left
  for (let i = labs.length - 2; i >= 0; i--) {
    const a = labs[i].getBBox(), b = labs[i + 1].getBBox(), shift = (+labs[i + 1].dataset.dx || 0);
    const over = a.x + a.width + 24 - (b.x + shift);
    if (over > 0) { labs[i].dataset.dx = -over; labs[i].setAttribute('transform', `translate(${-over} 0)`); }
  }
  g.append(svg('rect', { id: 'dTrain', x: -13, y: Y - 5, width: 26, height: 10, rx: 5, fill: '#fff' }));
}

function where(t) {
  for (const s of trip.steps) if (t < s.t0 + s.dur) return { s, p: s.p0 + (s.p1 - s.p0) * (s.dur ? (t - s.t0) / s.dur : 1) };
  const s = trip.steps.at(-1); return { s, p: s.p1, done: true };
}

function tickTrip() {
  const t = (performance.now() - trip.t0) / 1000 * SPEED;
  const { s, p, done } = where(t);
  placeTrain(me, s.L, p);
  $('#dTrain').setAttribute('transform', `translate(${dx(s.d0 + Math.abs(p - s.p0))} 0)`);
  const train = `Train ${s.L.no}`;
  const dir = Math.sign(s.p1 - s.p0), behind = dir > 0 ? Math.floor(p) : Math.ceil(p);
  const loc = s.p0 === s.p1 || Number.isInteger(p) ? `${train} is at ${s.L.stops[Math.round(p)]}` : `${train} · between ${s.L.stops[behind]} and ${s.L.stops[behind + dir]}`;
  const boardAt = trip.eta, leave = trip.eta + DWELL;
  if (done) { $('#sLabel').textContent = 'You have arrived'; $('#sBig').textContent = '00:00'; $('#sLoc').textContent = `Welcome to ${trip.dest}`; }
  else if (t < boardAt) { $('#sLabel').textContent = 'Your train arrives in'; $('#sBig').textContent = mmss(boardAt - t); $('#sLoc').textContent = loc; }
  else if (t < leave) { $('#sLabel').textContent = 'Boarding now · departs in'; $('#sBig').textContent = mmss(leave - t); $('#sLoc').textContent = `${train} is on Track ${1 + LINES.indexOf(trip.legs[0].L) % 3}`; }
  else { $('#sLabel').textContent = `Arriving at ${trip.dest} in`; $('#sBig').textContent = mmss(trip.total - t); $('#sLoc').textContent = loc; }
}

// ---------------- Main loop ----------------
let last = performance.now();
function frame(now) {
  const dt = Math.min(.1, (now - last) / 1000) * SPEED; last = now;
  {
    ambient.forEach(a => {
      a.p += a.dir * dt / SEG;
      const end = a.L.stops.length - 1;
      if (a.p <= 0 || a.p >= end) { a.dir *= -1; a.p = Math.min(end, Math.max(0, a.p)); }
      placeTrain(a.el, a.L, a.p);
    });
    if (trip) tickTrip();
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// ---------------- Departures board (glance band) ----------------
// shortcut: every line runs each way on a 30 min headway at a fixed offset; swap in Metrolink GTFS for real times.
function departures(now) {
  const m = now.getHours() * 60 + now.getMinutes(), out = [];
  LINES.forEach(L => [1, -1].forEach(dir => {
    const i = L.stops.indexOf(ORIGIN), to = dir > 0 ? L.stops.at(-1) : L.stops[0];
    if (i < 0 || to === ORIGIN) return;
    const off = (L.no * 7 + (dir > 0 ? 0 : 13)) % 30, mins = ((off - m) % 30 + 30) % 30 || 30;
    out.push({ L, to, mins, at: new Date(now.getTime() + mins * 60000) });
  }));
  return out.sort((a, b) => a.mins - b.mins).slice(0, 3);
}
let depMin = -1;
function drawDeps(now) {
  if (now.getMinutes() === depMin) return; depMin = now.getMinutes();
  $('#depList').replaceChildren(...departures(now).map(d => {
    const row = make('div', 'dep'), min = make('div', 'min', d.mins), mid = make('div'), sub = make('div', 'sub'), trk = make('div', 'trk');
    min.append(make('small', '', 'min'));
    const icon = svg('svg', { viewBox: '0 0 57.4978 26.8821', 'aria-hidden': 'true' }); icon.append(svg('path', { d: RIBBON, fill: d.L.color }));
    sub.append(icon, `${d.L.name} · Train ${d.L.no} · ${fmtClock(d.at)}`);
    mid.append(make('div', 'to', `To ${d.to}`), sub);
    trk.append(make('label', '', 'Track'), make('b', '', 1 + LINES.indexOf(d.L) % 3));
    row.append(min, mid, trk); return row;
  }));
}
console.assert(departures(new Date()).length > 0, 'no departures from', ORIGIN);

function clock() { const d = new Date(); drawDeps(d); $('#clock').textContent = fmtClock(d); $('#date').textContent = d.toLocaleDateString([], { weekday: 'short', month: 'short', day: 'numeric' }).toUpperCase(); }
setInterval(clock, 1000); clock();

// ---------------- Start ----------------
// No attract/welcome sequence: the screen opens on the station view and returns there when done or idle.
function start() {
  trip = null; me.classList.remove('show');
  R.forEach((r, k) => r.el.style.setProperty('--d', k * 9 + 'ms'));
  field.classList.remove('hidden', 'focus'); ST.forEach(s => s.classList.remove('hl'));
  $('#console').classList.remove('hidden');
  idle = 0; toStation();
}

field.addEventListener('click', e => { const st = e.target.dataset && e.target.dataset.st; if (st && st !== ORIGIN) go(st); });
field.addEventListener('pointerover', e => { const st = e.target.dataset && e.target.dataset.st; if (st && st !== ORIGIN) preview(st); });
field.addEventListener('pointerleave', () => step === 'select' && showStation(false));
$('#bBack').addEventListener('click', () => { trip = null; toStation(); });
$('#bDone').addEventListener('click', start);
addEventListener('keydown', e => {
  idle = 0;
  if (e.key === 'Escape') start();
});
addEventListener('pointerdown', () => idle = 0);
setInterval(() => { if (step !== 'station' && step !== 'select' && ++idle >= 90) start(); }, 1000); // 90 s without touch on a trip -> back to the station view

start();
</script>
</body>
</html>
